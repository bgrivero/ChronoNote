version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: chrononote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chrononote
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_postgres_schema.sql:/docker-entrypoint-initdb.d/001_postgres_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chrononote"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
